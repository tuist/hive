# Application releases use `app@X.Y.Z` tags. The server and Helm chart
# have independent release histories and changelog configurations.

[bump]
initial_tag = "app@0.1.0"
no_increment_regex = "^docs?(\\([^)]*\\))?:"

[remote.github]
owner = "tuist"
repo = "hive"

[changelog]
header = ""
body = """
## What's Changed
<!-- RELEASE NOTES START -->
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
  * {{ commit.message | split(pat="\n") | first | trim }}
{%- endfor %}
{% endfor %}

{% if version and previous.version %}
**Full Changelog**: https://github.com/tuist/hive/compare/{{ previous.version }}...{{ version }}
{% endif %}
"""
trim = true
footer = ""
postprocessors = [
  { pattern = '\\* (feat|fix|docs?|perf|refactor|style|test|chore|ci|build)(\\([^)]*\\))?:\\s*', replace = "* " },
]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
  { pattern = '\\(#([0-9]+)\\)', replace = "([#${1}](https://github.com/tuist/hive/pull/${1}))" },
]
commit_parsers = [
  { message = "^feat\\((native|mobile|app|apps)\\):", group = "Features" },
  { message = "^fix\\((native|mobile|app|apps)\\):", group = "Bug Fixes" },
  { message = "^perf\\((native|mobile|app|apps)\\):", group = "Performance" },
  { message = "^refactor\\((native|mobile|app|apps)\\):", group = "Refactoring" },
  { message = "^docs?\\((native|mobile|app|apps)\\):", group = "Documentation" },
  { message = "^[a-z]+", skip = true },
]
protect_breaking_commits = true
filter_commits = true
tag_pattern = "app@[0-9]+\\.[0-9]+\\.[0-9]+"
skip_tags = "beta|alpha"
ignore_tags = "rc"
topo_order = false
sort_commits = "newest"

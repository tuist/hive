[tools]
erlang = "29.0.3"
elixir = "1.20.2"
node = "lts"
aube = "1.15.0"
fnox = "latest"
kubectl = "latest"
kubelogin = "latest"   # int128/kubelogin — provides `kubectl oidc-login`
helm = "latest"
clusterctl = "latest"
jq = "latest"
yq = "latest"
"github-cli" = "latest"
"1password-cli" = "latest"
git-cliff = "latest"
"github:superradcompany/microsandbox" = "0.6.7"
rust = "1.88.0"
java = "17.0.2"
kotlin = "2.1.0"
android-sdk = "21.0"
"github:tuist/once" = { version = "0.28.0", exe = "once" }

[tools."github:ClickHouse/ClickHouse"]
version = "26.1.2.11-stable"
version_prefix = "v"

[tools."github:ClickHouse/ClickHouse".platforms]
macos-arm64 = { asset_pattern = "clickhouse-macos-aarch64" }
macos-x64 = { asset_pattern = "clickhouse-macos" }
linux-x64 = { asset_pattern = "clickhouse-common-static-*-amd64.tgz" }
linux-arm64 = { asset_pattern = "clickhouse-common-static-*-arm64.tgz" }

[hooks]
enter = { task = "clickhouse:start" }

[env]
ANDROID_HOME = "{{env.HOME}}/.local/share/mise/installs/android-sdk/21.0"
ANDROID_SDK_ROOT = "{{env.HOME}}/.local/share/mise/installs/android-sdk/21.0"
ANDROID_NDK_HOME = "{{env.HOME}}/.local/share/mise/installs/android-sdk/21.0/ndk/27.3.13750724"
_.path = [
  "{{env.HOME}}/.local/share/mise/installs/android-sdk/21.0/platform-tools",
  "{{env.HOME}}/.local/share/mise/installs/android-sdk/21.0/emulator",
]

[tasks."mobile:toolchains"]
description = "Install native mobile compiler targets"
run = '''
set -eu
rustup target add aarch64-apple-ios-sim aarch64-linux-android
'''

[tasks."clickhouse:start"]
description = "Start the local ClickHouse server"
run = "mise/tasks/clickhouse/start.sh"

[tasks."clickhouse:stop"]
description = "Stop the local ClickHouse server"
run = "mise/tasks/clickhouse/stop.sh"

[tasks."mobile:test"]
description = "Run the server client and work core tests through Once"
depends = ["mobile:toolchains"]
run = ["once test HiveMobileCoreTests", "once test HiveWorkCoreTests"]

[tasks."mobile:build:ios"]
description = "Build the Swift iOS application through Once"
depends = ["mobile:toolchains"]
run = "once build HiveiOS"

[tasks."mobile:build:android"]
description = "Build the Kotlin Android application through Once"
depends = ["mobile:toolchains"]
run = '''
set -eu
PATH="$(mise where kotlin)/kotlinc/bin:$PATH" once build HiveAndroid
'''

[tasks."mobile:build:watch"]
description = "Build the watchOS application through Once"
depends = ["mobile:toolchains"]
run = "once build HiveWatch"

[tasks."mobile:build"]
description = "Build the native companion applications"
depends = ["mobile:build:ios", "mobile:build:android", "mobile:build:watch"]

[tasks."native:build:macos"]
description = "Build the Hive macOS execution host through Once"
depends = ["mobile:toolchains"]
run = "once build HiveDesktop"

[tasks."native:build"]
description = "Build every native Hive application"
depends = ["mobile:build", "native:build:macos"]

name: Release

# Adapted from the tuist/tuist monorepo release workflow:
# https://github.com/tuist/tuist/blob/main/.github/workflows/release.yml
#
# On every push to main:
#   1. `check-releases` runs git-cliff per component to see whether any
#      conventional commits since the last `server@X.Y.Z` / `helm@X.Y.Z`
#      tag warrant a version bump.
#   2. `release-server` builds + pushes a versioned Docker image and
#      refreshes the root CHANGELOG.md.
#   3. `release-helm` packages the chart, pushes it to the GHCR OCI
#      registry, and refreshes infra/helm/hive/CHANGELOG.md.
#   4. `commit-and-release` tags the commit, publishes GitHub Releases
#      with the cliff-generated notes, and commits the CHANGELOG / Chart
#      bumps back to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tuist/hive
  CHART_NAME: hive
  CHART_OCI_REPO: oci://ghcr.io/tuist/charts

jobs:
  check-releases:
    name: Check for releasable changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      server-should-release: ${{ steps.server-check.outputs.should-release }}
      server-next-version: ${{ steps.server-check.outputs.next-version }}
      server-next-version-number: ${{ steps.server-check.outputs.next-version-number }}
      helm-should-release: ${{ steps.helm-check.outputs.should-release }}
      helm-next-version: ${{ steps.helm-check.outputs.next-version }}
      helm-next-version-number: ${{ steps.helm-check.outputs.next-version-number }}
      should-release-any: ${{ steps.any.outputs.should-release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install_args: git-cliff
          cache: "false"

      - name: Check server for releasable changes
        id: server-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_VERSION=$(git tag -l | grep -E '^server@[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)

          if [ -n "$LATEST_VERSION" ]; then
            CHANGELOG=$(git cliff --config cliff.toml --repository "." 2>/dev/null -- ${LATEST_VERSION}..HEAD || echo "")
          else
            CHANGELOG=$(git cliff --config cliff.toml --repository "." 2>/dev/null || echo "")
          fi

          if echo "$CHANGELOG" | sed -n '/<!-- RELEASE NOTES START -->/,/<!-- generated by git-cliff -->/p' | grep -qE '^\*'; then
            if [ -n "$LATEST_VERSION" ]; then
              NEXT_VERSION=$(git cliff --config cliff.toml --repository "." --bumped-version 2>/dev/null -- ${LATEST_VERSION}..HEAD)
            else
              NEXT_VERSION=$(git cliff --config cliff.toml --repository "." --bumped-version 2>/dev/null)
            fi
          else
            NEXT_VERSION="${LATEST_VERSION:-server@0.1.0}"
          fi

          # Normalize prefix.
          if [[ "$NEXT_VERSION" != server@* ]]; then
            NEXT_VERSION="server@${NEXT_VERSION#server@}"
          fi

          echo "Latest server version: ${LATEST_VERSION:-none}"
          echo "Next server version: $NEXT_VERSION"

          if [ "$LATEST_VERSION" != "$NEXT_VERSION" ]; then
            echo "should-release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "next-version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "next-version-number=${NEXT_VERSION#server@}" >> "$GITHUB_OUTPUT"

      - name: Check helm for releasable changes
        id: helm-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_VERSION=$(git tag -l | grep -E '^helm@[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)

          if [ -n "$LATEST_VERSION" ]; then
            CHANGELOG=$(git cliff --include-path "infra/helm/**/*" --config infra/helm/hive/cliff.toml --repository "." 2>/dev/null -- ${LATEST_VERSION}..HEAD || echo "")
          else
            CHANGELOG=$(git cliff --include-path "infra/helm/**/*" --config infra/helm/hive/cliff.toml --repository "." 2>/dev/null || echo "")
          fi

          if echo "$CHANGELOG" | sed -n '/<!-- RELEASE NOTES START -->/,/<!-- generated by git-cliff -->/p' | grep -qE '^\*'; then
            if [ -n "$LATEST_VERSION" ]; then
              NEXT_VERSION=$(git cliff --include-path "infra/helm/**/*" --config infra/helm/hive/cliff.toml --repository "." --bumped-version 2>/dev/null -- ${LATEST_VERSION}..HEAD)
            else
              NEXT_VERSION=$(git cliff --include-path "infra/helm/**/*" --config infra/helm/hive/cliff.toml --repository "." --bumped-version 2>/dev/null)
            fi
          else
            NEXT_VERSION="${LATEST_VERSION:-helm@0.1.0}"
          fi

          if [[ "$NEXT_VERSION" != helm@* ]]; then
            NEXT_VERSION="helm@${NEXT_VERSION#helm@}"
          fi

          echo "Latest helm version: ${LATEST_VERSION:-none}"
          echo "Next helm version: $NEXT_VERSION"

          if [ "$LATEST_VERSION" != "$NEXT_VERSION" ]; then
            echo "should-release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "next-version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "next-version-number=${NEXT_VERSION#helm@}" >> "$GITHUB_OUTPUT"

      - name: Aggregate
        id: any
        run: |
          if [ "${{ steps.server-check.outputs.should-release }}" == "true" ] || \
             [ "${{ steps.helm-check.outputs.should-release }}" == "true" ]; then
            echo "should-release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-release=false" >> "$GITHUB_OUTPUT"
          fi

  release-server:
    name: Release server image
    needs: check-releases
    if: needs.check-releases.outputs.server-should-release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install_args: git-cliff
          cache: "false"

      - name: Build release body
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check-releases.outputs.server-next-version-number }}
        run: |
          LATEST_VERSION=$(git tag -l | grep -E '^server@[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)

          if [ -n "$LATEST_VERSION" ]; then
            NOTES=$(git cliff --config cliff.toml --repository "." 2>/dev/null -- ${LATEST_VERSION}..HEAD | sed -n '/<!-- RELEASE NOTES START -->/,$p' | tail -n +2)
          else
            NOTES=$(git cliff --config cliff.toml --repository "." 2>/dev/null | sed -n '/<!-- RELEASE NOTES START -->/,$p' | tail -n +2)
          fi

          cat > release-body.md <<EOF
          ## Docker image

          \`ghcr.io/tuist/hive:${VERSION}\` — [view in GitHub Container Registry](https://github.com/${{ github.repository }}/pkgs/container/hive)

          $NOTES
          EOF

          echo "::group::release-body.md"
          cat release-body.md
          echo "::endgroup::"

      - name: Update CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_VERSION=$(git tag -l | grep -E '^server@[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ -n "$LATEST_VERSION" ]; then
            git cliff --config cliff.toml --repository "." --bump -o CHANGELOG.md 2>/dev/null -- ${LATEST_VERSION}..HEAD
          else
            git cliff --config cliff.toml --repository "." --bump -o CHANGELOG.md 2>/dev/null
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.check-releases.outputs.server-next-version-number }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/upload-artifact@v4
        with:
          name: server-artifacts
          path: |
            CHANGELOG.md
            release-body.md
          retention-days: 1

  release-helm:
    name: Release Helm chart
    needs: check-releases
    if: needs.check-releases.outputs.helm-should-release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install_args: "git-cliff helm"
          cache: "false"

      - name: Build release body
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check-releases.outputs.helm-next-version-number }}
        run: |
          LATEST_VERSION=$(git tag -l | grep -E '^helm@[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)

          if [ -n "$LATEST_VERSION" ]; then
            NOTES=$(git cliff --include-path "infra/helm/**/*" --config infra/helm/hive/cliff.toml --repository "." 2>/dev/null -- ${LATEST_VERSION}..HEAD | sed -n '/<!-- RELEASE NOTES START -->/,$p' | tail -n +2)
          else
            NOTES=$(git cliff --include-path "infra/helm/**/*" --config infra/helm/hive/cliff.toml --repository "." 2>/dev/null | sed -n '/<!-- RELEASE NOTES START -->/,$p' | tail -n +2)
          fi

          cat > infra/helm/hive/release-body.md <<EOF
          ## Helm chart (OCI artifact)

          \`oci://ghcr.io/tuist/charts/hive:${VERSION}\` — [view in GitHub Container Registry](https://github.com/orgs/tuist/packages/container/charts%2Fhive)

          Install with:

          \`\`\`bash
          helm install hive oci://ghcr.io/tuist/charts/hive --version ${VERSION}
          \`\`\`

          $NOTES
          EOF

          echo "::group::release-body.md"
          cat infra/helm/hive/release-body.md
          echo "::endgroup::"

      - name: Update Chart.yaml
        run: |
          NEXT="${{ needs.check-releases.outputs.helm-next-version-number }}"
          sed -i "s/^version: .*/version: ${NEXT}/" infra/helm/hive/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${NEXT}\"/" infra/helm/hive/Chart.yaml

      - name: Update CHANGELOG.md
        working-directory: infra/helm/hive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_VERSION=$(git tag -l | grep -E '^helm@[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ -n "$LATEST_VERSION" ]; then
            git cliff --include-path "infra/helm/**/*" --config cliff.toml --repository "../../.." --bump -o CHANGELOG.md 2>/dev/null -- ${LATEST_VERSION}..HEAD
          else
            git cliff --include-path "infra/helm/**/*" --config cliff.toml --repository "../../.." --bump -o CHANGELOG.md 2>/dev/null
          fi

      - name: Login to GHCR for Helm OCI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Package Helm chart
        run: helm package infra/helm/hive

      - name: Push Helm chart
        run: helm push ${{ env.CHART_NAME }}-${{ needs.check-releases.outputs.helm-next-version-number }}.tgz ${{ env.CHART_OCI_REPO }}

      - uses: actions/upload-artifact@v4
        with:
          name: helm-artifacts
          path: |
            infra/helm/hive/Chart.yaml
            infra/helm/hive/CHANGELOG.md
            infra/helm/hive/release-body.md
          retention-days: 1

  commit-and-release:
    name: Tag, publish, and commit changelogs
    needs: [check-releases, release-server, release-helm]
    if: |
      always() &&
      needs.check-releases.outputs.should-release-any == 'true' &&
      (needs.release-server.result == 'success' || needs.release-server.result == 'skipped') &&
      (needs.release-helm.result == 'success' || needs.release-helm.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.HIVE_RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Download server artifacts
        if: needs.check-releases.outputs.server-should-release == 'true' && needs.release-server.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: server-artifacts

      - name: Download helm artifacts
        if: needs.check-releases.outputs.helm-should-release == 'true' && needs.release-helm.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: helm-artifacts
          path: infra/helm/hive

      - name: Tag released components
        run: |
          if [ "${{ needs.check-releases.outputs.server-should-release }}" == "true" ] && \
             [ "${{ needs.release-server.result }}" == "success" ]; then
            git tag ${{ needs.check-releases.outputs.server-next-version }}
          fi
          if [ "${{ needs.check-releases.outputs.helm-should-release }}" == "true" ] && \
             [ "${{ needs.release-helm.result }}" == "success" ]; then
            git tag ${{ needs.check-releases.outputs.helm-next-version }}
          fi

      - name: Create server GitHub Release
        if: needs.check-releases.outputs.server-should-release == 'true' && needs.release-server.result == 'success'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: false
          name: Server ${{ needs.check-releases.outputs.server-next-version-number }}
          tag_name: ${{ needs.check-releases.outputs.server-next-version }}
          body_path: release-body.md

      - name: Create Helm GitHub Release
        if: needs.check-releases.outputs.helm-should-release == 'true' && needs.release-helm.result == 'success'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: false
          name: Helm Chart ${{ needs.check-releases.outputs.helm-next-version-number }}
          tag_name: ${{ needs.check-releases.outputs.helm-next-version }}
          body_path: infra/helm/hive/release-body.md

      - name: Commit CHANGELOG / Chart bumps
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          FILES_ADDED=false

          if [ "${{ needs.check-releases.outputs.server-should-release }}" == "true" ] && \
             [ "${{ needs.release-server.result }}" == "success" ]; then
            git add CHANGELOG.md
            FILES_ADDED=true
          fi

          if [ "${{ needs.check-releases.outputs.helm-should-release }}" == "true" ] && \
             [ "${{ needs.release-helm.result }}" == "success" ]; then
            git add infra/helm/hive/Chart.yaml infra/helm/hive/CHANGELOG.md
            FILES_ADDED=true
          fi

          if [ "$FILES_ADDED" == "true" ]; then
            MSG="chore(release):"
            if [ "${{ needs.check-releases.outputs.server-should-release }}" == "true" ]; then
              MSG="$MSG server@${{ needs.check-releases.outputs.server-next-version-number }}"
            fi
            if [ "${{ needs.check-releases.outputs.helm-should-release }}" == "true" ]; then
              MSG="$MSG helm@${{ needs.check-releases.outputs.helm-next-version-number }}"
            fi
            git commit -m "$MSG [skip ci]"
            git push origin HEAD:main
          fi

      - name: Push tags
        run: git push --tags

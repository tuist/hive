name: docs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "mise.toml"
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "mise.toml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_VERSION: "2026.4.18"
  MISE_GITHUB_ATTESTATIONS: 0

jobs:
  build:
    name: build docs
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      - name: install mise toolchain
        uses: jdx/mise-action@v4.0.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: "node aube"

      - name: install dependencies
        run: aube ci

      - name: build docs
        run: aube run build

  deploy:
    name: deploy docs
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: docs
      url: https://docs.hive.tuist.dev
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      - name: install mise toolchain
        uses: jdx/mise-action@v4.0.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: "node aube"

      - name: install dependencies
        run: aube ci

      - name: build docs
        run: aube run build

      - name: Load Cloudflare credentials from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_DOCS }}
          CLOUDFLARE_API_TOKEN: op://hive-docs-production/cloudflare-api-token/credential
          CLOUDFLARE_ACCOUNT_ID: op://hive-docs-production/cloudflare-account-id/credential

      - name: deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.90.1"
          workingDirectory: docs
          command: deploy
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

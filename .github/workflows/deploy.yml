name: Deploy

# Build the Hive image, push to GHCR, and `helm upgrade` against the
# hive-production workload cluster.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit SHA to deploy (defaults to the event's SHA)
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tuist/hive
  SANDBOX_IMAGE_NAME: tuist/hive-coding-sandbox
  HELM_CHART_PATH: infra/helm/hive
  HELM_RELEASE_NAME: hive
  NAMESPACE: hive-production
  AGENT_SANDBOX_VERSION: v0.5.1
  DEPLOY_SHA: ${{ inputs.commit_sha || github.sha }}

jobs:
  build:
    name: Build + push
    runs-on: tuist-linux
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - id: tag
        run: echo "image_tag=sha-$(echo "$DEPLOY_SHA" | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.image_tag }}
          build-args: |
            RUNTIME_PACKAGE_REFRESH=${{ env.DEPLOY_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./infra/coding-sandbox/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.SANDBOX_IMAGE_NAME }}:${{ steps.tag.outputs.image_tag }}
          cache-from: type=gha,scope=coding-sandbox
          cache-to: type=gha,mode=max,scope=coding-sandbox

  deploy:
    name: Deploy
    needs: build
    runs-on: tuist-linux
    environment:
      name: production
      url: https://hive.tuist.dev
    timeout-minutes: 20
    env:
      KUBECONFIG: ${{ github.workspace }}/.kube/config
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: jdx/mise-action@v4
        with:
          install_args: "helm kubectl"
          cache: "false"
      - uses: 1password/install-cli-action@8d006a0d0a4fd505af7f7ce589e7f768385ff5e4 # v3
        with:
          version: "2.35.0"
      - name: Load kubeconfig from 1Password
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          mkdir -p "$(dirname "$KUBECONFIG")"
          op document get "kubeconfig: hive-production" \
            --vault hive-k8s-production --output "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
      - name: Verify cluster reachability
        run: |
          set -euo pipefail
          API="$(kubectl config view --minify --raw -o jsonpath='{.clusters[0].cluster.server}')"
          echo "Reaching apiserver at $API"
          kubectl --request-timeout=10s get --raw /version >/dev/null
      - name: Install Agent Sandbox controller
        run: |
          kubectl apply --server-side \
            -f "https://github.com/kubernetes-sigs/agent-sandbox/releases/download/${AGENT_SANDBOX_VERSION}/manifest.yaml"
          kubectl -n agent-sandbox-system rollout status deploy/agent-sandbox-controller --timeout=5m
      - name: Verify sandbox worker capacity
        run: |
          set -euo pipefail
          kubectl get runtimeclass gvisor >/dev/null
          test -n "$(kubectl get nodes -l hive.tuist.dev/workload=coding-sandbox -o name)"
          kubectl get nodes -l hive.tuist.dev/workload=coding-sandbox \
            -o jsonpath='{range .items[*]}{range .spec.taints[*]}{.key}={.value}:{.effect}{"\n"}{end}{end}' \
            | grep -qx 'hive.tuist.dev/workload=coding-sandbox:NoSchedule'
      - name: Recover stuck release
        run: |
          status=$(helm status "$HELM_RELEASE_NAME" -n "$NAMESPACE" -o json 2>/dev/null \
            | grep -o '"status":"[^"]*"' | head -1 | cut -d'"' -f4 || true)
          echo "Current release status: ${status:-<none>}"
          case "$status" in
            pending-install)
              echo "Release stuck in pending-install; uninstalling."
              helm uninstall "$HELM_RELEASE_NAME" -n "$NAMESPACE" --wait || true
              ;;
            pending-upgrade|pending-rollback)
              echo "Release stuck in $status; rolling back to last deployed revision."
              helm rollback "$HELM_RELEASE_NAME" -n "$NAMESPACE" --timeout 5m || true
              ;;
          esac
      - name: helm upgrade --install
        run: |
          helm upgrade --install "$HELM_RELEASE_NAME" "$HELM_CHART_PATH" \
            --namespace "$NAMESPACE" --create-namespace \
            --values "$HELM_CHART_PATH/values-production.yaml" \
            --set image.tag="${{ needs.build.outputs.image_tag }}" \
            --set codingRuns.image.tag="${{ needs.build.outputs.image_tag }}" \
            --set env.SENTRY_RELEASE="$DEPLOY_SHA" \
            --timeout 15m
      - name: Diagnostics on failure
        if: failure()
        run: |
          set +e
          echo "::group::helm history"
          helm history "$HELM_RELEASE_NAME" -n "$NAMESPACE" --max 10 || true
          echo "::endgroup::"
          echo "::group::pods"
          kubectl -n "$NAMESPACE" get pods -o wide || true
          echo "::endgroup::"
          echo "::group::events"
          kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp 2>&1 | tail -100 || true
          echo "::endgroup::"
          echo "::group::deployment + pods"
          kubectl -n "$NAMESPACE" describe deploy/hive || true
          for pod in $(kubectl -n "$NAMESPACE" get pods -l app.kubernetes.io/name=hive -o name 2>/dev/null); do
            kubectl -n "$NAMESPACE" describe "$pod" || true
            kubectl -n "$NAMESPACE" logs "$pod" --all-containers --tail=500 || true
            kubectl -n "$NAMESPACE" logs "$pod" --all-containers --previous --tail=500 || true
          done
          echo "::endgroup::"
          echo "::group::external secrets"
          kubectl -n "$NAMESPACE" get externalsecret 2>&1 || true
          kubectl -n "$NAMESPACE" describe externalsecret 2>&1 || true
          echo "::endgroup::"
      - name: Smoke test
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" rollout status deploy/hive --timeout=10m
          kubectl -n "$NAMESPACE" run smoke-$RANDOM --rm -i --restart=Never --image=curlimages/curl \
            --command -- sh -ec '
              curl -fsS "http://hive/ready" >/dev/null
              curl -fsS -H "x-forwarded-proto: https" "http://hive/login" > /tmp/login.html
              open_graph_path="$(sed -n "s/.*property=\"og:image\" content=\"[^\"]*\\(\\/open-graph\\/card.jpg?token=[^\"]*\\)\".*/\\1/p" /tmp/login.html | head -n 1)"
              test -n "$open_graph_path"
              curl -fsS -H "x-forwarded-proto: https" -o /tmp/open-graph.jpg "http://hive${open_graph_path}"
              test "$(head -c 2 /tmp/open-graph.jpg | od -An -tx1 | tr -d " \n")" = "ffd8"
            '

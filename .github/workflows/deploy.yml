name: Deploy

# Build the Hive image, push to GHCR, and `helm upgrade` against the
# hive-production workload cluster.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit SHA to deploy (defaults to the event's SHA)
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tuist/hive
  SANDBOX_IMAGE_NAME: tuist/hive-coding-sandbox
  HELM_CHART_PATH: infra/helm/hive
  HELM_RELEASE_NAME: hive
  NAMESPACE: hive-production
  AGENT_SANDBOX_VERSION: v0.5.2
  DEPLOY_SHA: ${{ inputs.commit_sha || github.sha }}

jobs:
  build:
    name: Build + push
    runs-on: tuist-linux
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - id: tag
        run: echo "image_tag=sha-$(echo "$DEPLOY_SHA" | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.image_tag }}
          build-args: |
            RUNTIME_PACKAGE_REFRESH=${{ env.DEPLOY_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./infra/coding-sandbox/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.SANDBOX_IMAGE_NAME }}:${{ steps.tag.outputs.image_tag }}
          cache-from: type=gha,scope=coding-sandbox
          cache-to: type=gha,mode=max,scope=coding-sandbox

  deploy:
    name: Deploy
    needs: build
    runs-on: tuist-linux
    environment:
      name: production
      url: https://hive.tuist.dev
    timeout-minutes: 25
    env:
      KUBECONFIG: ${{ github.workspace }}/.kube/config
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: jdx/mise-action@v4
        with:
          install_args: "helm kubectl yq"
          cache: "false"
      - uses: 1password/install-cli-action@8d006a0d0a4fd505af7f7ce589e7f768385ff5e4 # v3
        with:
          version: "2.35.0"
      - name: Load kubeconfig from 1Password
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          mkdir -p "$(dirname "$KUBECONFIG")"
          op document get "kubeconfig: hive-production" \
            --vault hive-k8s-production --output "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
      - name: Verify cluster reachability
        run: |
          set -euo pipefail
          API="$(kubectl config view --minify --raw -o jsonpath='{.clusters[0].cluster.server}')"
          echo "Reaching apiserver at $API"
          kubectl --request-timeout=10s get --raw /version >/dev/null
      # The production overlay is the single source of truth for whether coding
      # sandboxes ship. Keying the Agent Sandbox install and the gVisor gates off
      # it means flipping `codingRuns.provider` back to `kubernetes` restores the
      # preflight automatically, with no second flag to keep in sync.
      - name: Resolve coding sandbox mode
        id: sandboxes
        run: |
          set -euo pipefail
          provider="$(yq '.codingRuns.provider' "$HELM_CHART_PATH/values-production.yaml")"
          echo "Coding sandbox provider in the production overlay: ${provider}"
          if [ "$provider" = "kubernetes" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Agent Sandbox install and gVisor preflight: coding runs are not scheduled on this cluster."
          fi
      - name: Install Agent Sandbox controller
        if: steps.sandboxes.outputs.enabled == 'true'
        run: |
          kubectl apply --server-side \
            -f "https://github.com/kubernetes-sigs/agent-sandbox/releases/download/${AGENT_SANDBOX_VERSION}/sandbox.yaml"
          kubectl -n agent-sandbox-system rollout status deploy/agent-sandbox-controller --timeout=5m
      - name: Install gVisor RuntimeClass
        if: steps.sandboxes.outputs.enabled == 'true'
        run: kubectl apply --server-side -f infra/k8s/gvisor-runtime-class.yaml
      - name: Verify sandbox worker capacity
        if: steps.sandboxes.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          kubectl get runtimeclass gvisor >/dev/null
          test -n "$(kubectl get nodes -l hive.tuist.dev/workload=coding-sandbox -o name)"
          kubectl get nodes -l hive.tuist.dev/workload=coding-sandbox \
            -o jsonpath='{range .items[*]}{range .spec.taints[*]}{.key}={.value}:{.effect}{"\n"}{end}{end}' \
            | grep -qx 'hive.tuist.dev/workload=coding-sandbox:NoSchedule'
      - name: Verify gVisor runtime
        if: steps.sandboxes.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          preflight_pod="gvisor-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'kubectl delete pod "$preflight_pod" --ignore-not-found --wait=false' EXIT
          # runsc always answers syslog(2) with its "Starting gVisor" banner for
          # any process, so the check needs no capabilities. The securityContext
          # is written to satisfy the restricted Pod Security Standard (nonroot,
          # seccomp, no caps) so admission can never reject the preflight itself.
          kubectl create -f - <<YAML
          apiVersion: v1
          kind: Pod
          metadata:
            name: ${preflight_pod}
          spec:
            automountServiceAccountToken: false
            restartPolicy: Never
            runtimeClassName: gvisor
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              runAsGroup: 65534
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: verify
                image: busybox:1.37.0
                command:
                  - sh
                  - -ec
                  - dmesg | grep -q "Starting gVisor"
                resources:
                  requests:
                    cpu: 10m
                    memory: 16Mi
                  limits:
                    cpu: 100m
                    memory: 32Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
          YAML
          # Poll the phase directly instead of `kubectl wait ...=Succeeded`: that
          # cannot short-circuit on a Failed pod (it would block the full deadline
          # on a genuinely broken runtime), and it cannot tell a slow cold-node
          # schedule or image pull apart from a real gVisor failure. A Pending pod
          # is capacity, not a runtime verdict, so it gets the whole deadline.
          deadline=$(( SECONDS + 300 ))
          while :; do
            phase="$(kubectl get "pod/${preflight_pod}" \
              -o jsonpath='{.status.phase}' 2>/dev/null || true)"
            case "$phase" in
              Succeeded)
                echo "gVisor verified: runsc sandboxed the preflight pod on coding-sandbox capacity."
                exit 0
                ;;
              Failed)
                echo "::error::gVisor preflight ran but did not report a gVisor kernel; runsc is not sandboxing workloads on the coding-sandbox pool."
                kubectl describe "pod/${preflight_pod}" || true
                kubectl logs "pod/${preflight_pod}" || true
                exit 1
                ;;
            esac
            if (( SECONDS >= deadline )); then
              echo "::error::gVisor preflight pod never ran (still ${phase:-Pending} after 5m). This is almost always coding-sandbox scheduling or busybox image-pull capacity, not a runtime failure; check the events below."
              kubectl describe "pod/${preflight_pod}" || true
              kubectl logs "pod/${preflight_pod}" 2>/dev/null || true
              exit 1
            fi
            sleep 3
          done
      - name: Recover stuck release
        run: |
          status=$(helm status "$HELM_RELEASE_NAME" -n "$NAMESPACE" -o json 2>/dev/null \
            | grep -o '"status":"[^"]*"' | head -1 | cut -d'"' -f4 || true)
          echo "Current release status: ${status:-<none>}"
          case "$status" in
            pending-install)
              echo "Release stuck in pending-install; uninstalling."
              helm uninstall "$HELM_RELEASE_NAME" -n "$NAMESPACE" --wait || true
              ;;
            pending-upgrade|pending-rollback)
              echo "Release stuck in $status; rolling back to last deployed revision."
              helm rollback "$HELM_RELEASE_NAME" -n "$NAMESPACE" --timeout 5m || true
              ;;
          esac
      - name: helm upgrade --install
        run: |
          helm upgrade --install "$HELM_RELEASE_NAME" "$HELM_CHART_PATH" \
            --namespace "$NAMESPACE" --create-namespace \
            --values "$HELM_CHART_PATH/values-production.yaml" \
            --set image.tag="${{ needs.build.outputs.image_tag }}" \
            --set codingRuns.image.tag="${{ needs.build.outputs.image_tag }}" \
            --set env.SENTRY_RELEASE="$DEPLOY_SHA" \
            --timeout 15m
      - name: Diagnostics on failure
        if: failure()
        run: |
          set +e
          echo "::group::helm history"
          helm history "$HELM_RELEASE_NAME" -n "$NAMESPACE" --max 10 || true
          echo "::endgroup::"
          echo "::group::pods"
          kubectl -n "$NAMESPACE" get pods -o wide || true
          echo "::endgroup::"
          echo "::group::events"
          kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp 2>&1 | tail -100 || true
          echo "::endgroup::"
          echo "::group::deployment + pods"
          kubectl -n "$NAMESPACE" describe deploy/hive || true
          for pod in $(kubectl -n "$NAMESPACE" get pods -l app.kubernetes.io/name=hive -o name 2>/dev/null); do
            kubectl -n "$NAMESPACE" describe "$pod" || true
            kubectl -n "$NAMESPACE" logs "$pod" --all-containers --tail=500 || true
            kubectl -n "$NAMESPACE" logs "$pod" --all-containers --previous --tail=500 || true
          done
          echo "::endgroup::"
          echo "::group::external secrets"
          kubectl -n "$NAMESPACE" get externalsecret 2>&1 || true
          kubectl -n "$NAMESPACE" describe externalsecret 2>&1 || true
          echo "::endgroup::"
      - name: Smoke test
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" rollout status deploy/hive --timeout=10m
          kubectl -n "$NAMESPACE" run smoke-$RANDOM --rm -i --restart=Never --image=curlimages/curl \
            --command -- sh -ec '
              curl -fsS "http://hive/ready" >/dev/null
              curl -fsS -H "x-forwarded-proto: https" "http://hive/login" > /tmp/login.html
              open_graph_path="$(sed -n "s/.*property=\"og:image\" content=\"[^\"]*\\(\\/open-graph\\/card.jpg?token=[^\"]*\\)\".*/\\1/p" /tmp/login.html | head -n 1)"
              test -n "$open_graph_path"
              curl -fsS -H "x-forwarded-proto: https" -o /tmp/open-graph.jpg "http://hive${open_graph_path}"
              test "$(head -c 2 /tmp/open-graph.jpg | od -An -tx1 | tr -d " \n")" = "ffd8"
            '

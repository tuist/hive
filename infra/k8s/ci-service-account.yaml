# ServiceAccount used by GitHub Actions to deploy the Hive Helm chart into
# the workload cluster. Its long-lived token is rendered into the kubeconfig
# stored as `kubeconfig: hive-production` in the `hive-k8s-production`
# 1Password vault.
#
# RBAC is cluster-admin for now because the deployer manages namespaced app
# resources plus chart dependencies that reference cluster-scoped resources
# such as ClusterSecretStore and CNPG CRDs.

apiVersion: v1
kind: Namespace
metadata:
  name: hive-production
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-actions-deployer
  namespace: hive-production
---
apiVersion: v1
kind: Secret
metadata:
  name: github-actions-deployer-token
  namespace: hive-production
  annotations:
    kubernetes.io/service-account.name: github-actions-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hive-github-actions-deployer
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: github-actions-deployer
    namespace: hive-production

# Tuist-specific values for the Hive Helm chart, applied on top of the
# generic defaults in values.yaml. Assumes the production cluster has:
# - cert-manager, ingress-nginx, external-dns
# - the External Secrets Operator with a ClusterSecretStore named
#   `onepassword-hive` pointing at the `hive-k8s-production` 1Password
#   vault
# - the CloudNativePG operator
# - Hetzner Cloud block storage

host: hive.tuist.dev

image:
  pullSecretName: ghcr-pull

env:
  # Tuist's instance is public: anyone can browse it. Google login is
  # the team's path, restricted to @tuist.dev via HIVE_GOOGLE_ALLOWED_DOMAINS.
  # GitHub login is intentionally left unrestricted (no HIVE_GITHUB_ALLOWED_DOMAINS)
  # so external contributors can sign in with their own accounts.
  HIVE_VISIBILITY: "public"
  HIVE_GOOGLE_ALLOWED_DOMAINS: "tuist.dev"
  # Accounts on these domains are org members (see organization-only
  # forage sources); everyone else who signs in is an external contributor.
  HIVE_ORG_DOMAINS: "tuist.dev"
  HIVE_OBJECT_STORAGE_PROVIDER: "s3"
  HIVE_S3_FORCE_PATH_STYLE: "true"

externalSecrets:
  enabled: true
  storeRef:
    name: onepassword-hive
    kind: ClusterSecretStore
  items:
    SECRET_KEY_BASE:
      remoteRef: "hive-secret-key-base/password"
    HIVE_GOOGLE_CLIENT_ID:
      remoteRef: "hive-google-oauth/username"
    HIVE_GOOGLE_CLIENT_SECRET:
      remoteRef: "hive-google-oauth/credential"
    HIVE_GITHUB_CLIENT_ID:
      remoteRef: "hive-github-oauth/username"
    HIVE_GITHUB_CLIENT_SECRET:
      remoteRef: "hive-github-oauth/credential"
    HIVE_GITHUB_APP_ID:
      remoteRef: "hive-github-app/app-id"
    HIVE_GITHUB_APP_INSTALLATION_ID:
      remoteRef: "hive-github-app/installation-id"
    HIVE_GITHUB_APP_PRIVATE_KEY:
      remoteRef: "hive-github-app/private-key"
    HIVE_GITHUB_WEBHOOK_SECRET:
      remoteRef: "hive-github-app/webhook-secret"
    HIVE_S3_BUCKET:
      remoteRef: "hive-object-storage/bucket"
    HIVE_S3_REGION:
      remoteRef: "hive-object-storage/region"
    HIVE_S3_ENDPOINT_URL:
      remoteRef: "hive-object-storage/endpoint-url"
    HIVE_S3_ACCESS_KEY_ID:
      remoteRef: "hive-object-storage/username"
    HIVE_S3_SECRET_ACCESS_KEY:
      remoteRef: "hive-object-storage/credential"
  pullSecret:
    enabled: true
    item: "hive-ghcr-pull"
    field: "notesPlain"

postgres:
  storageClass: hcloud-volumes
  backup:
    enabled: true
    endpointURL: https://fsn1.your-objectstorage.com
    destinationPath: s3://hive-postgres-backups/production
    externalSecret:
      accessKeyRemoteRef: "hive-postgres-backup/username"
      secretKeyRemoteRef: "hive-postgres-backup/credential"

vector:
  enabled: true
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      memory: 4Gi
  storage:
    endpointURL: "https://fsn1.your-objectstorage.com"
    region: "fsn1"
    bucket: "hive-object-storage"
    prefix: "vector/production"
  cache:
    size: 50Gi
    storageClass: hcloud-volumes
    diskCapacityBytes: 42949672960
    memoryCapacityBytes: 536870912

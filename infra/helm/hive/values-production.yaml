# Tuist-specific values for the Hive Helm chart, applied on top of the
# generic defaults in values.yaml. Assumes the production cluster has:
# - cert-manager, ingress-nginx, external-dns
# - the External Secrets Operator with a ClusterSecretStore named
#   `onepassword-hive` pointing at the `hive-k8s-production` 1Password
#   vault
# - the CloudNativePG operator
# - Hetzner Cloud block storage
# - Kubernetes Agent Sandbox and a gVisor RuntimeClass on dedicated workers

host: hive.tuist.dev

image:
  pullSecretName: ghcr-pull

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 2Gi

# hive.tuist.dev is non-critical and low-traffic, running on a single
# worker node. One replica, no autoscaling, no PodDisruptionBudget: HA
# isn't achievable (or needed) on a single node, and a PDB would block
# node drains during cluster upgrades.
replicaCount: 1

autoscaling:
  enabled: false

pdb:
  enabled: false

env:
  # Tuist's instance is public: anyone can browse it. Google login is
  # the team's path, restricted to @tuist.dev via HIVE_GOOGLE_ALLOWED_DOMAINS.
  # GitHub login is intentionally left unrestricted (no HIVE_GITHUB_ALLOWED_DOMAINS)
  # so external contributors can sign in with their own accounts.
  HIVE_VISIBILITY: "public"
  # The Hive logo belongs to the open source product. Tuist's instance
  # presents itself with Tuist's mark instead.
  HIVE_LOGO_URL: "https://tuist.dev/android-chrome-512x512.png"
  HIVE_GOOGLE_ALLOWED_DOMAINS: "tuist.dev"
  # Accounts on these domains are org members (see organization-only
  # forage sources); everyone else who signs in is an external contributor.
  HIVE_ORG_DOMAINS: "tuist.dev"
  HIVE_EMAIL_PROVIDER: "smtp"
  HIVE_EMAIL_FROM: "Hive <hive@mail.tuist.dev>"
  HIVE_SMTP_RELAY: "smtp.eu.mailgun.org"
  HIVE_SMTP_PORT: "587"
  HIVE_OBJECT_STORAGE_PROVIDER: "s3"
  HIVE_S3_FORCE_PATH_STYLE: "true"
  # LLM model identifier in ReqLLM `provider:model_id` form, shared by
  # every agentic feature. The API key is pulled from 1Password below.
  HIVE_LLM_MODEL: "fireworks_ai:accounts/fireworks/models/kimi-k2p7-code"
  # Channel in the tuist-company Slack that Hive.Errors.DropAlerter
  # pings when the ingest pipeline is dropping events on the floor
  # (buffer flush failures, unrecoverable per-event errors). Alerts
  # here are meant to be all-hands stop-what-you're-doing; if the
  # channel gets noisy from routine failures, fix the root cause,
  # don't move it somewhere quieter.
  HIVE_ALERTS_SLACK_CHANNEL_ID: "C061VCZC2V8"

codingRuns:
  # Temporarily disabled to unblock deploys. The coding-sandbox pool is a
  # single fixed cpx42 node (~4 concurrent sandboxes) with no autoscaler, and
  # the gVisor preflight gate was blocking every production deploy. Re-enable
  # by flipping this back to `kubernetes`: the deploy workflow keys its Agent
  # Sandbox and gVisor verification off this value, so the gates come back
  # automatically. Owner: @pepicrft. Removal condition: coding-sandbox node
  # capacity scales with demand (autoscaler bounds on the `coding-sandbox`
  # MachineDeployment in tuist/tuist, plus a hive-production autoscaler
  # instance) so runs no longer contend for one node's worth of capacity.
  provider: disabled
  image:
    repository: ghcr.io/tuist/hive-coding-sandbox
    tag: sha-set-by-deploy
    pullPolicy: IfNotPresent
  setupCommand: "true"
  kubernetes:
    namespace: hive-sandboxes
    runtimeClassName: gvisor
    imagePullSecretName: ghcr-pull
    nodeSelector:
      hive.tuist.dev/workload: coding-sandbox
    tolerations:
      - key: hive.tuist.dev/workload
        operator: Equal
        value: coding-sandbox
        effect: NoSchedule

externalSecrets:
  enabled: true
  storeRef:
    name: onepassword-hive
    kind: ClusterSecretStore
  items:
    SECRET_KEY_BASE:
      remoteRef: "hive-secret-key-base/password"
    HIVE_GOOGLE_CLIENT_ID:
      remoteRef: "hive-google-oauth/username"
    HIVE_GOOGLE_CLIENT_SECRET:
      remoteRef: "hive-google-oauth/credential"
    HIVE_GITHUB_CLIENT_ID:
      remoteRef: "hive-github-oauth/username"
    HIVE_GITHUB_CLIENT_SECRET:
      remoteRef: "hive-github-oauth/credential"
    HIVE_GITHUB_APP_ID:
      remoteRef: "hive-github-app/app-id"
    HIVE_GITHUB_APP_INSTALLATION_ID:
      remoteRef: "hive-github-app/installation-id"
    HIVE_GITHUB_APP_PRIVATE_KEY:
      remoteRef: "hive-github-app/private-key"
    HIVE_GITHUB_WEBHOOK_SECRET:
      remoteRef: "hive-github-app/webhook-secret"
    HIVE_SLACK_CLIENT_ID:
      remoteRef: "hive-slack-oauth/username"
    HIVE_SLACK_CLIENT_SECRET:
      remoteRef: "hive-slack-oauth/credential"
    HIVE_SLACK_SIGNING_SECRET:
      remoteRef: "hive-slack-signing-secret/credential"
    HIVE_SLACK_ALLOWED_TEAM_IDS:
      remoteRef: "hive-slack-allowed-team-ids/credential"
    HIVE_SMTP_USERNAME:
      remoteRef: "hive-mailgun-smtp/username"
    HIVE_SMTP_PASSWORD:
      remoteRef: "hive-mailgun-smtp/credential"
    HIVE_S3_BUCKET:
      remoteRef: "hive-object-storage/bucket"
    HIVE_S3_REGION:
      remoteRef: "hive-object-storage/region"
    HIVE_S3_ENDPOINT_URL:
      remoteRef: "hive-object-storage/endpoint-url"
    HIVE_S3_ACCESS_KEY_ID:
      remoteRef: "hive-object-storage/username"
    HIVE_S3_SECRET_ACCESS_KEY:
      remoteRef: "hive-object-storage/credential"
    HIVE_LLM_API_KEY:
      remoteRef: "hive-llm-api-key/credential"
  pullSecret:
    enabled: true
    item: "hive-ghcr-pull"
    field: "notesPlain"

postgres:
  # Single instance: continuous WAL archiving to object storage (below)
  # is the recovery path, so a hot standby isn't worth a second node's
  # worth of resources for a non-critical service.
  instances: 1
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: enabled
  storageClass: hcloud-volumes
  backup:
    enabled: true
    endpointURL: https://fsn1.your-objectstorage.com
    destinationPath: s3://hive-postgres-backups/production
    externalSecret:
      accessKeyRemoteRef: "hive-postgres-backup/username"
      secretKeyRemoteRef: "hive-postgres-backup/credential"

clickhouse:
  enabled: true
  nodeSelector:
    node.cluster.x-k8s.io/pool: general
  persistence:
    size: 50Gi
    storageClass: hcloud-volumes
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 4Gi

# Log-shipping pipeline disabled to keep the workload on a single small
# worker: it consumed 1 vCPU / 2Gi + a 50Gi cache volume. Errors are still
# captured by Sentry and live logs via `kubectl logs`. Flip back to `true`
# to restore long-term log archival to object storage.
vector:
  enabled: false
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      memory: 4Gi
  storage:
    endpointURL: "https://fsn1.your-objectstorage.com"
    region: "fsn1"
    bucket: "hive-object-storage"
    prefix: "vector/production"
  cache:
    size: 50Gi
    storageClass: hcloud-volumes
    diskCapacityBytes: 42949672960
    memoryCapacityBytes: 536870912

{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "hive.appSecretName" . }}
  labels:
    {{- include "hive.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeRef.name }}
    kind: {{ .Values.externalSecrets.storeRef.kind }}
  target:
    name: {{ include "hive.appSecretName" . }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        {{- range $env, $cfg := .Values.externalSecrets.items }}
        {{- if $cfg.remoteRef }}
        {{ $env }}: "{{ printf "{{ .%s | trim }}" $env }}"
        {{- end }}
        {{- end }}
        {{- if .Values.vector.enabled }}
        vector.yaml: |
          storage:
            type: SlateDb
            path: {{ .Values.vector.storage.prefix | quote }}
            object_store:
              type: Aws
              region: "{{ printf "{{ index . %q | trim }}" .Values.vector.externalSecrets.s3RegionKey }}"
              bucket: "{{ printf "{{ index . %q | trim }}" .Values.vector.externalSecrets.s3BucketKey }}"
            block_cache:
              type: FoyerHybrid
              memory_capacity: {{ printf "%.0f" (.Values.vector.cache.memoryCapacityBytes | float64) }}
              disk_capacity: {{ printf "%.0f" (.Values.vector.cache.diskCapacityBytes | float64) }}
              disk_path: {{ printf "%s/block-cache" .Values.vector.cache.mountPath | quote }}
          dimensions: {{ .Values.vector.config.dimensions }}
          distance_metric: {{ .Values.vector.config.distanceMetric }}
          flush_interval: {{ .Values.vector.config.flushInterval }}
          split_threshold_vectors: {{ .Values.vector.config.splitThresholdVectors }}
          merge_threshold_vectors: {{ .Values.vector.config.mergeThresholdVectors }}
          split_search_neighbourhood: {{ .Values.vector.config.splitSearchNeighbourhood }}
          metadata_fields:
            {{- toYaml .Values.vector.config.metadataFields | nindent 12 }}
        {{- end }}
  data:
    {{- range $env, $cfg := .Values.externalSecrets.items }}
    {{- if $cfg.remoteRef }}
    - secretKey: {{ $env }}
      remoteRef:
        key: {{ $cfg.remoteRef | quote }}
    {{- end }}
    {{- end }}
{{- if .Values.externalSecrets.pullSecret.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.image.pullSecretName }}
  labels:
    {{- include "hive.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeRef.name }}
    kind: {{ .Values.externalSecrets.storeRef.kind }}
  target:
    name: {{ .Values.image.pullSecretName }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: "{{ `{{ .dockerconfigjson | b64dec }}` }}"
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        key: "{{ .Values.externalSecrets.pullSecret.item }}/{{ .Values.externalSecrets.pullSecret.field }}"
{{- end }}
{{- end }}

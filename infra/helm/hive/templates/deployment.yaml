{{- $appSecret := include "hive.appSecretName" . -}}
{{- $pgSecret := include "hive.postgresAppSecret" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hive.fullname" . }}
  labels:
    {{- include "hive.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "hive.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "hive.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: {{ include "hive.fullname" . }}
      {{- if .Values.image.pullSecretName }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecretName }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/bash
            - -ec
            - |
              echo "Waiting for ${PGHOST}:${PGPORT}..."
              until (echo > /dev/tcp/$PGHOST/$PGPORT) >/dev/null 2>&1; do sleep 2; done
              export DATABASE_URL="ecto://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}"
              exec /app/bin/hive eval "Hive.Release.migrate"
          env:
            - name: PHX_HOST
              value: {{ .Values.host | quote }}
            {{- if and .Values.vector.enabled (not (hasKey .Values.env "HIVE_OPENDATA_VECTOR_URL")) }}
            - name: HIVE_OPENDATA_VECTOR_URL
              value: {{ printf "http://%s:%v" (include "hive.vectorName" .) .Values.vector.service.port | quote }}
            {{- end }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ $pgSecret }}
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $pgSecret }}
                  key: password
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: {{ $pgSecret }}
                  key: host
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: {{ $pgSecret }}
                  key: port
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ $pgSecret }}
                  key: dbname
          envFrom:
            - secretRef:
                name: {{ $appSecret }}
      containers:
        - name: hive
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              export DATABASE_URL="ecto://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}"
              exec /app/bin/server
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: PHX_HOST
              value: {{ .Values.host | quote }}
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}
            {{- include "hive.conduktSandboxEnv" . | nindent 12 }}
            {{- if and .Values.vector.enabled (not (hasKey .Values.env "HIVE_OPENDATA_VECTOR_URL")) }}
            - name: HIVE_OPENDATA_VECTOR_URL
              value: {{ printf "http://%s:%v" (include "hive.vectorName" .) .Values.vector.service.port | quote }}
            {{- end }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ $pgSecret }}
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $pgSecret }}
                  key: password
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: {{ $pgSecret }}
                  key: host
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: {{ $pgSecret }}
                  key: port
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ $pgSecret }}
                  key: dbname
          envFrom:
            - secretRef:
                name: {{ $appSecret }}
          startupProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

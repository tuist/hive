# Generic defaults for the Hive Helm chart.
#
# These values let anyone deploy their own Hive instance. Tuist's
# production configuration lives in `values-production.yaml` and is
# applied on top of these defaults via `helm upgrade -f`.

nameOverride: ""
fullnameOverride: "hive"

# Public hostname for the deployment. Override per environment.
host: hive.example.com

image:
  repository: ghcr.io/tuist/hive
  tag: ""
  pullPolicy: IfNotPresent
  # Name of an existing imagePullSecret in the release namespace. Leave
  # empty if the image is public or your nodes are already authenticated.
  pullSecretName: ""

replicaCount: 2

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 75

pdb:
  enabled: true
  minAvailable: 1

service:
  port: 80
  targetPort: 4000

ingress:
  className: nginx
  clusterIssuer: letsencrypt-prod

# Static, non-sensitive environment variables passed to the pod.
# Add provider env vars (Google, generic OIDC) in your environment
# overlay to require login.
env:
  POOL_SIZE: "10"
  DATABASE_SSL: "1"
  # public: anyone can reach the dashboard. private: routes are gated
  # behind login and only authenticated users (passing any configured
  # provider's domain allowlist) can access them.
  HIVE_VISIBILITY: "public"
  # Name and logo the instance presents itself with. Leave unset to run
  # under Hive's own branding; HIVE_LOGO_URL takes an absolute URL to a
  # publicly reachable image.
  # HIVE_PRODUCT_NAME: "Hive"
  # HIVE_LOGO_URL: "https://example.com/logo.png"
  # none: object storage is disabled. s3: configure HIVE_S3_* env vars
  # below, usually with credentials coming from `externalSecrets.items`.
  HIVE_OBJECT_STORAGE_PROVIDER: "none"
  # none disables account email notifications. Set to postmark or smtp
  # and provide the matching credentials through a Secret.
  HIVE_EMAIL_PROVIDER: "none"
  HIVE_S3_FORCE_PATH_STYLE: "false"
  # When the Sentry Data Source Name is present, events are tagged with
  # this deployment environment. SENTRY_RELEASE is usually set per deploy.
  SENTRY_ENVIRONMENT: "production"
  # Capture failed Oban jobs in Sentry after they exhaust all attempts.
  # Turn retry reporting on to see every failed attempt.
  SENTRY_OBAN_CAPTURE_ERRORS: "true"
  SENTRY_OBAN_REPORT_RETRIES: "false"
  SENTRY_OBAN_CRON_MONITORING: "true"

codingRuns:
  # disabled, microsandbox, kubernetes, or the stable name of a custom provider.
  provider: disabled
  image:
    repository: ubuntu
    tag: "24.04"
    pullPolicy: IfNotPresent
  setupCommand: ""
  cpus: 2
  memoryMi: 4096
  diskMi: 8192
  timeoutMinutes: 30
  kubernetes:
    namespace: hive-sandboxes
    createNamespace: true
    inCluster: true
    runtimeClassName: gvisor
    serviceAccountName: ""
    imagePullSecretName: ""
    readyTimeoutMilliseconds: 120000
    nodeSelector: {}
    tolerations: []
    networkPolicy:
      enabled: true
    quota:
      enabled: true
      pods: "4"
      requestsCpu: "8"
      requestsMemory: 16Gi
      limitsCpu: "8"
      limitsMemory: 16Gi

probes:
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 3
    failureThreshold: 3
  startup:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30

# Secrets injected into the pod via envFrom. By default the chart
# expects a Kubernetes Secret named `<release>-hive-app` (matching
# `hive.appSecretName`) to already exist in the namespace with at
# minimum `SECRET_KEY_BASE`. Two options to populate it:
#
#   1. Create it yourself (`kubectl create secret generic ...`). Set
#      `secrets.existingSecret` to point at a differently-named secret.
#   2. Enable `externalSecrets.enabled` below if you run the
#      External Secrets Operator; the chart will create the secret
#      for you from your configured backend (e.g. 1Password, Vault).
secrets:
  existingSecret: ""

# External Secrets integration. Disabled by default so the generic
# chart doesn't assume ESO is installed. Enable + provide a store
# reference and remote refs in your environment overlay.
externalSecrets:
  enabled: false
  refreshInterval: 1h
  storeRef:
    name: ""
    kind: ClusterSecretStore
  # Map of env var name → external backend reference. Only items with
  # a non-empty `remoteRef` are wired up. Set in your overlay, e.g.:
  #
  #   items:
  #     SECRET_KEY_BASE:
  #       remoteRef: "hive-secret-key-base/password"
  #     HIVE_GOOGLE_CLIENT_ID:
  #       remoteRef: "google-oauth/username"
  #     HIVE_GOOGLE_CLIENT_SECRET:
  #       remoteRef: "google-oauth/credential"
  #     SENTRY_DSN:
  #       remoteRef: "hive-sentry/dsn"
  items: {}
  pullSecret:
    enabled: false
    item: ""
    field: ""

postgres:
  enabled: true
  instances: 2
  annotations: {}
  storageSize: 20Gi
  # Empty string lets the cluster default storage class be used.
  storageClass: ""
  imageName: ghcr.io/cloudnative-pg/postgresql:18.0
  database: hive
  owner: hive
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  backup:
    enabled: false
    endpointURL: ""
    destinationPath: ""
    retention: 30d
    schedule: "0 0 3 * * *"
    credentialsSecretName: hive-postgres-backup-credentials
    externalSecret:
      accessKeyRemoteRef: ""
      secretKeyRemoteRef: ""

# Optional vector database used by agentic features that need embedding search.
# It mirrors Atlas' opendata-vector deployment: vectors are persisted in an
# S3-compatible bucket and a PVC is used only as a local cache. Disabled by
# default so self-hosted installs can start with just Postgres.
vector:
  enabled: false
  image:
    repository: ghcr.io/opendata-oss/vector
    tag: "0.2.1"
    pullPolicy: IfNotPresent
  containerPort: 8080
  logLevel: info
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi
  service:
    port: 8080
  storage:
    # Defaults to env.HIVE_S3_ENDPOINT_URL / env.HIVE_S3_REGION /
    # env.HIVE_S3_BUCKET when those are plain values. Set these explicitly
    # when the app object-storage values come from a Secret or ExternalSecret.
    # Credentials are always read from the Hive app Secret's HIVE_S3_* keys.
    endpointURL: ""
    region: ""
    bucket: ""
    prefix: "vector"
  externalSecrets:
    s3RegionKey: HIVE_S3_REGION
    s3BucketKey: HIVE_S3_BUCKET
  cache:
    size: 20Gi
    # Empty string lets the cluster default storage class be used.
    storageClass: ""
    mountPath: /var/cache/opendata-vector
    diskCapacityBytes: 17179869184
    memoryCapacityBytes: 268435456
  config:
    dimensions: 1536
    distanceMetric: L2
    flushInterval: 60
    splitThresholdVectors: 150
    mergeThresholdVectors: 50
    splitSearchNeighbourhood: 0
    metadataFields:
      - name: source_type
        field_type: String
        indexed: true
  probes:
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 15
      timeoutSeconds: 3
      failureThreshold: 3

# git-cliff config for the Hive app (Phoenix server + Docker image).
#
# Tagging scheme: plain semver `X.Y.Z` (the chart in infra/helm/hive
# has its own `helm@X.Y.Z` scheme, see infra/helm/hive/cliff.toml). The
# tag_pattern below also matches the legacy `server@X.Y.Z` tags so the
# bump logic keeps working until the latest tag is a plain one.
# Conventional commits scoped with `(helm)` are skipped so they only
# affect the chart's changelog; everything else here counts toward the
# next app release.

[bump]
initial_tag = "0.1.0"

[remote.github]
owner = "tuist"
repo = "hive"

[changelog]
header = """
# Changelog

All notable changes to the Hive application are documented in this file.
"""
body = """
## What's Changed

{%- if version %} in {{ version }}{%- endif -%}
<!-- RELEASE NOTES START -->
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
  {% if commit.github.pr_title -%}
    {%- set commit_message = commit.github.pr_title -%}
  {%- else -%}
    {%- set commit_message = commit.message -%}
  {%- endif -%}
  * {{ commit_message | split(pat="\n") | first | trim }}\
    {% if commit.github.username %} by [@{{ commit.github.username }}](https://github.com/{{ commit.github.username }}){%- endif -%}
    {% if commit.github.pr_number %} in \
      [#{{ commit.github.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.github.pr_number }}) \
    {%- endif %}
{%- endfor -%}
{% endfor %}

{% if version %}
    {% if previous.version %}
      **Full Changelog**: {{ self::remote_url() }}/compare/{{ previous.version }}...{{ version }}
    {% endif %}
{% else -%}
  {% raw %}\n{% endraw %}
{% endif %}

{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}
"""
trim = true
footer = """
<!-- generated by git-cliff -->
"""
postprocessors = [
    { pattern = '\* (feat|fix|docs?|perf|refactor|style|test|chore|ci|build)(\([^)]*\))?:\s*', replace = "* " },
]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
    { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "" },
]
commit_parsers = [
    # Helm-scoped commits belong to the chart's changelog, not the app's.
    { message = "^[a-z]+\\([^)]*\\bhelm\\b[^)]*\\)", skip = true },
    # Group everything else by type. Scoped or unscoped, both count.
    { message = "^feat(\\(.*\\))?:", group = "<!-- 0 -->⛰️  Features" },
    { message = "^fix(\\(.*\\))?:", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^refactor(\\(.*\\))?:", group = "<!-- 2 -->🚜 Refactor" },
    { message = "^docs?(\\(.*\\))?:", group = "<!-- 3 -->📚 Documentation" },
    { message = "^perf(\\(.*\\))?:", group = "<!-- 4 -->⚡ Performance" },
    { message = "^style(\\(.*\\))?:", group = "<!-- 5 -->🎨 Styling" },
    { message = "^test(\\(.*\\))?:", group = "<!-- 6 -->🧪 Testing" },
    # Chore and ci don't ship anything user-facing.
    { message = "^chore", skip = true },
    { message = "^ci", skip = true },
    { message = "^build", skip = true },
]
protect_breaking_commits = false
filter_commits = true
tag_pattern = "(server@)?[0-9].*"
skip_tags = "beta|alpha"
ignore_tags = "rc"
topo_order = false
sort_commits = "newest"

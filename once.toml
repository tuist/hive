[[target]]
name = "SharedRust"
kind = "rust_mobile_library"
srcs = ["mobile/shared/src/**/*.rs"]

[target.attrs]
crate_name = "hive_mobile_core"
crate_root = "mobile/shared/src/lib.rs"
edition = "2021"
apple_target = "aarch64-apple-ios-sim"
android_target = "aarch64-linux-android"
android_abi = "arm64-v8a"
android_api = 24

[[target]]
name = "SharedRustTests"
kind = "rust_test"
srcs = ["mobile/shared/src/**/*.rs"]

[target.attrs]
crate_name = "hive_mobile_core_tests"
crate_root = "mobile/shared/src/lib.rs"
edition = "2021"

[[target]]
name = "AppleApp"
kind = "apple_application"
srcs = ["mobile/ios/Hive/**/*.swift"]
deps = ["./SharedRust"]

[target.attrs]
platform = "ios"
sdk_variant = "simulator"
bundle_id = "dev.tuist.hive"
minimum_os = "17.0"
families = ["iphone", "ipad"]
product_name = "Hive"
entitlements = "mobile/ios/Hive/Hive.entitlements"
sdk_frameworks = ["AuthenticationServices", "Foundation", "Security", "SwiftUI", "UIKit"]

[[target]]
name = "AndroidApp"
kind = "android_binary"
srcs = ["mobile/android/src/**/*.kt"]
deps = ["./SharedRust"]

[target.attrs]
application_id = "dev.tuist.hive"
manifest = "mobile/android/AndroidManifest.xml"
resource_files = ["mobile/android/res/**"]
resource_dirs = ["mobile/android/res"]
compile_sdk = 35
min_sdk_version = 24
target_sdk_version = 35
build_tools_version = "35.0.0"
version_code = 1
version_name = "1.0"
launch_activity = ".MainActivity"
emulator_device = "once_example"
